apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator-chart
  namespace: flux-system
spec:
  interval: 24h0m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: 0.50.0
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-web
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator-chart
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: flux-web
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: flux-web
    installCRDs: true
    web:
      enabled: true
      serverOnly: true

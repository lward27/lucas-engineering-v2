apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h0m0s
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  chart:
    spec:
      chart: cilium
      interval: 12h0m0s
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.19.3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: cilium
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    gatewayAPI:
      enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
          - 10.42.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443
    kubeProxyReplacement: true
    operator:
      replicas: 1
    routingMode: tunnel
    tunnelProtocol: vxlan

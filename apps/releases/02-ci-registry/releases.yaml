apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: docker-registry
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/docker-registry
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  install:
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: docker-registry
  targetNamespace: registry
  timeout: 10m0s
  upgrade:
    remediation:
      retries: 3
  values:
    docker-registry:
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi

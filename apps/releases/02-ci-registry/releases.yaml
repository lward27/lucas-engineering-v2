---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-ci
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/tekton-ci
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  dependsOn:
    - name: tekton-triggers
  install:
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: tekton-ci
  targetNamespace: tekton-pipelines
  timeout: 10m0s
  upgrade:
    remediation:
      retries: 3
  values:
    registry:
      host: registry-v2.lucas.engineering
    webhookIngress:
      host: tekton-webhooks-v2.lucas.engineering
      tls:
        enabled: false

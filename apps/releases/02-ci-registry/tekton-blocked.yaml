# Not referenced by kustomization.yaml yet.
# The old tekton-pipeline wrapper currently renders duplicate
# ConfigMap/config-observability resources, which Helm rejects before install.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-pipeline
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/tekton-pipeline
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  interval: 30m0s
  releaseName: tekton-pipeline
  targetNamespace: tekton-pipelines
  timeout: 10m0s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-triggers
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/tekton-triggers
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  dependsOn:
    - name: tekton-pipeline
  interval: 30m0s
  releaseName: tekton-triggers
  targetNamespace: tekton-pipelines
  timeout: 10m0s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-dashboard
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/tekton-dashboard
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  dependsOn:
    - name: tekton-pipeline
  interval: 30m0s
  releaseName: tekton-dashboard
  targetNamespace: tekton-pipelines
  timeout: 10m0s
  values:
    ingress:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-ci
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/tekton-ci
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  dependsOn:
    - name: tekton-triggers
  interval: 30m0s
  releaseName: tekton-ci
  targetNamespace: tekton-pipelines
  timeout: 10m0s
  values:
    registry:
      host: registry-v2.lucas.engineering
    webhookIngress:
      host: tekton-webhooks-v2.lucas.engineering
      tls:
        enabled: false

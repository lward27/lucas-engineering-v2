apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/hermes-agent
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 30m0s
  releaseName: hermes-agent
  targetNamespace: hermes-agent
  values:
    hermes:
      runtime:
        mode: kubernetes
      secrets:
        apiKeysOptional: false
        kubeconfigOptional: true
        sshOptional: true
      config:
        pruneProviderKeysOnStart:
          - lmstudio_lan
        model:
          provider: custom:fireworks
          default: accounts/fireworks/models/glm-5p2
        providers:
          lmstudio_lan: null
          fireworks:
            name: Fireworks
            baseUrl: https://api.fireworks.ai/inference/v1
            keyEnv: FIREWORKS_API_KEY
            transport: chat_completions
      tools:
        kubectl:
          enabled: false
        gh:
          enabled: false
      ingress:
        enabled: false
      networkPolicy:
        enabled: false

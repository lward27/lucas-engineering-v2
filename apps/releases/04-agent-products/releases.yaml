apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forge-platform
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/forge-platform
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: forge-apps
        namespace: flux-system
  dependsOn:
    - name: forge-postgresql
  interval: 30m0s
  releaseName: forge-platform
  targetNamespace: forge-platform
  values:
    forgePlatform:
      ingress:
        enabled: false
        host: forge-v2.lucas.engineering
---

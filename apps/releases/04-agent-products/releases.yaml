apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/hermes-agent
      interval: 10m0s
      sourceRef:
        kind: GitRepository
        name: lucas-engineering-apps
        namespace: flux-system
  interval: 30m0s
  releaseName: hermes-agent
  targetNamespace: hermes-agent
  values:
    hermes:
      ingress:
        enabled: false
---
